p:10px; margin-bottom:20px;}\n  .timer-display{font-family:'Poppins',system-ui,sans-serif; font-weight:800; font-size:clamp(38px,9vw,56px); color:var(--gold); letter-spacing:2px;}\n  .timer-display.low{color:var(--red); animation:tpulse .5s infinite alternate;}\n  @keyframes tpulse{from{transform:scale(1);} to{transform:scale(1.08);}}\n  .timer-controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;}\n  .timer-input{width:66px; padding:7px 8px; border-radius:8px; border:1px solid var(--gold-dim); background:var(--panel2); color:var(--ink); font-size:14px; text-align:center;}\n\n.rules{width:100%;min-height:100vh;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 30%,#0c1a4a 0%,#04061a 70%,#000 100%)}\n.rules-card{max-width:660px;width:100%;background:rgba(8,16,50,.75);border:3px solid var(--gold);border-radius:18px;padding:24px 28px}\n.rules-card h2{margin:0 0 10px;color:var(--gold);font-family:'Poppins',sans-serif}\n.rules-card ol{padding-left:22px;margin:0 0 18px}.rules-card li{margin:9px 0;line-height:1.5}\n.status{text-align:center;color:var(--gold-light);font-weight:600;min-height:26px;margin-bottom:10px}\n.pot{text-align:center;font-family:'Poppins',sans-serif;font-weight:800;color:var(--gold);font-size:22px;margin:-6px 0 12px}\n.btn.bad{background:var(--red);color:#fff}\n.buzz:disabled{opacity:.35;cursor:not-allowed}.team.out{opacity:.4;filter:grayscale(1)}\n.slot.missed{opacity:.6}.slot.missed .slot-text,.slot.missed .slot-pts{display:block!important;color:var(--muted)}.slot.missed .slot-hint{display:none}\n.team-btns .timer-input{width:60px}.board .controls{margin-top:14px}\n<\/style><\/head><body>\n<div class=\"start-screen\" id=\"startScreen\"><div class=\"beam beam-left\"><\/div><div class=\"beam beam-right\"><\/div><div class=\"beam beam-top\"><\/div>\n<div class=\"ff-oval\"><div class=\"ff-title\">FEUD<\/div><div class=\"ff-title\">NIGHT<\/div><\/div><button class=\"start-btn\" onclick=\"startGame()\">START<\/button><\/div>\n<div class=\"rules\" id=\"rules\" style=\"display:none\"><div class=\"rules-card\"><h2>Feud Night \u2014 How to play<\/h2><ol><li>One player from each team comes to the table. The bell is in the middle.<\/li><li>The host shows the question. The fastest player to ring the bell gives an answer from the board.<\/li><li>A wrong answer knocks that player's team out for this question, and the question is asked again to the teams left.<\/li><li>The team with the first correct answer takes control and gets 2 minutes to find the remaining answers. Every answer must come from a different player.<\/li><li>Three wrong answers or the end of the timer ends their turn. The question then passes randomly to one of the other teams.<\/li><li>That team gets one guess. If it is right, they steal the round pot plus their answer's points. If it is wrong, the first team keeps the pot and the rest of the answers are shown.<\/li><li>Every answer has its own points. They are added to the round pot as answers are revealed.<\/li><\/ol><button class=\"btn\" onclick=\"playNow()\">LET'S PLAY<\/button><\/div><\/div>\n<div class=\"game-screen\" id=\"gameScreen\" style=\"display:none\">\n<div class=\"top-row\"><button class=\"mini\" onclick=\"toHub()\">\u2190 Hub<\/button><div class=\"title\" style=\"margin:0\">\ud83c\udfae Game Night<\/div><div class=\"spacer\"><\/div><\/div>\n<div class=\"teams\" id=\"teams\"><\/div>\n<div class=\"board\">\n<div class=\"timer-box\"><div class=\"timer-display\" id=\"timerDisplay\">02:00<\/div><div class=\"timer-controls\">\n<input type=\"number\" id=\"timerSet\" class=\"timer-input\" min=\"5\" step=\"5\" value=\"120\"><button class=\"mini\" onclick=\"setDur()\">Set (sec)<\/button>\n<button class=\"btn\" id=\"timerStartBtn\" onclick=\"toggleTimer()\">Start<\/button><button class=\"mini\" onclick=\"addTimer(30)\">+30<\/button><button class=\"mini\" onclick=\"resetTimer()\">Reset<\/button><\/div><\/div>\n<div class f(++n>=14){clearInterval(t);steal=c[Math.floor(Math.random()*2)];ph='steal';spin=false;sfxReveal();render()}},110)}\nfunction markMissed(){rounds[cur].a.forEach((_,i)=>{if(!rev[i])miss[i]=true})}\nfunction finish(w,amt,m){addPts(w,amt);ph='done';msg=m||`\ud83c\udf89 ${teams[w].name} wins ${amt} pts!`;markMissed();stopTimer();sfxClap();render()}\nfunction burn(){ph='done';msg='\ud83d\udd25 Question burned. Nobody scored.';markMissed();stopTimer();sfxLose();render()}\nfunction move(d){cur=(cur+d+rounds.length)%rounds.length;reset()}\nfunction reset(){stopTimer();ph='idle';ring=-1;ctrl=-1;steal=-1;out=[false,false,false];pot=0;strikes=0;msg='';spin=false;rev=rounds[cur].a.map(()=>false);miss=rev.slice();tl=dur;render()}\nfunction manual(i,s){const v=parseInt(document.getElementById('m'+i).value,10)||0;addPts(i,s*v);if(s>0)sfxClap();else sfxLose();render()}\nfunction renderTimer(){const m=String(Math.floor(tl/60)).padStart(2,'0'),s=String(tl%60).padStart(2,'0'),d=document.getElementById('timerDisplay');d.textContent=m+':'+s;d.classList.toggle('low',run&&tl<=10&&tl>0);document.getElementById('timerStartBtn').textContent=run?'Pause':'Start'}\nfunction stopTimer(){clearInterval(tint);run=false;renderTimer()}\nfunction toggleTimer(){if(run)stopTimer();else{if(tl<=0)tl=dur;run=true;tint=setInterval(tick,1000);renderTimer()}}\nfunction tick(){tl--;if(tl<=0){tl=0;stopTimer();if(ph==='play')endPlay();else sfxTimeUp();return}renderTimer();sfxTick(tl<=10)}\nfunction addTimer(n){tl+=n;renderTimer()}\nfunction resetTimer(){stopTimer();tl=dur;renderTimer()}\nfunction setDur(){const v=parseInt(document.getElementById('timerSet').value,10);if(v>0){dur=v;if(!run){tl=v;renderTimer()}}}\nreset();\n<\/script><\/body><\/html>", "<!DOCTYPE html><html lang=\"en\" dir=\"ltr\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>Emoji Challenge<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Fredoka:wght@600;700&family=Inter:wght@400;600&display=swap\" rel=\"stylesheet\"><style>\n  :root{\n    --bg:#2a0a4a; --pink:#ff4fa3; --cyan:#22d3ee; --yellow:#ffd93d; --card:#fff8e7; --dark:#2a0a4a;\n    --green:#22c55e; --red:#ff4d4d; --muted:#d9c7f5;\n    box-sizing:border-box;\n    padding-top:env(safe-area-inset-top,0px);\n    padding-bottom:env(safe-area-inset-bottom,0px);\n  }\n  *{box-sizing:inherit;}\n  html{scroll-padding-top:env(safe-area-inset-top,0px);}\n  html,body{height:100%;}\n  body{margin:0; background:var(--bg); color:#fff; font-family:'Inter','Cairo',system-ui,sans-serif; min-height:100%; display:flex; flex-direction:column; align-items:center;}\n  .fun{font-family:'Fredoka',system-ui,sans-serif;}\n\n  /* start screen */\n  .start-screen{width:100%; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px; position:relative; overflow:hidden; padding:20px; transition:opacity .4s ease;\n    background:radial-gradient(circle at 15% 20%, #7a24d6 0, transparent 45%), radial-gradient(circle at 85% 85%, #d81b7a 0, transparent 45%), var(--bg);}\n  .start-screen.fade-out{opacity:0; pointer-events:none;}\n  .deco{position:absolute; font-size:clamp(34px,7vw,64px); opacity:.3; pointer-events:none;}\n  .badge{position:relative; z-index:2; width:min(88vw,520px); text-align:center; background:var(--card); color:var(--dark); border:6px solid var(--dark); border-radius:30px;\n    box-shadow:10px 10px 0 var(--pink); transform:rotate(-2deg); padding:26px 30px;}\n  .badge .row{font-size:clamp(26px,7vw,36px); letter-spacing:8px; margin-bottom:8px;}\n  .b1{font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(46px,14vw,88px); line-height:1; color:var(--dark);}\n  .b2{font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(28px,9vw,56px); line-height:1.1; color:var(--pink); letter-spacing:1px;}\n  .start-btn{position:relative; z-index:2; padding:12px 52px; border-radius:18px; border:4px solid var(--dark); background:var(--yellow); color:var(--dark);\n    font-family:'Fredoka',sans-serif; font-weight:700; font-size:24px; cursor:pointer; box-shadow:0 7px 0 var(--dark);}\n  .start-btn:active{transform:translateY(5px); box-shadow:0 2px 0 var(--dark);}\n\n  /* game screen */\n  .game-screen{width:100%; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 14px 40px;\n    background:radial-gradient(rgba(255,255,255,.09) 1.5px, transparent 1.6px) 0 0/22px 22px, linear-gradient(180deg,#3b0f6b 0%,#1e0736 100%);}\n  .top-row{display:flex; align-items:center; justify-content:space-between; width:100%; max-width:920px; margin-bottom:14px;}\n  .top-row .spacer{width:70px;}\n  .title{font-family:'Fredoka',sans-serif; font-size:clamp(26px,5vw,38px); font-weight:700; color:var(--yellow); text-align:center; margin:0;}\n\n  .teams{display:flex; gap:14px; width:100%; max-width:920px; flex-wrap:wrap; justify-content:center; margin-bottom:22px;}\n  .team{background:var(--card); color:var(--dark); border:4px solid var(--dark); border-radius:18px; box-shadow:6px 6px 0 var(--cyan); padding:14px 18px; flex:1 1 200px; text-align:center;}\n  .team.active{background:#ffe3f1; box-shadow:6px 6px 0 var(--pink);}\n  .team-name{font-weight:700; font-size:17px; color:var(--dark); outline:none; border-bottom:2px dashed transparent;}\n  .team-name:focus{border-bottom:2px dashed var(--pink);}\n  .score{font-family:'Fredoka',sans-serif; font-size:46px; font-weight:700; color:var(--pink); line-height:1.1; margin:2px 0;}\n  .team-btns{display:flex; gap:8px; justify-content:center; margin-top:6px;}\n  .mini{background:var(--cyan); color:var(--dark); border:3px solid var(--dark); border-radius:10px; padding:5px 12px; font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; cursor:pointer; box-shadow:0 3px 0 var(--dark);}\n  .mini:active,.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--dark);}\n  .buzz{background:#fff; color:var(--dark); border:3px solid var(--dark); border-radius:10px; padding:5px 12px; font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; cursor:pointer; margin-top:10px;}\n  .team.active .buzz{background:var(--pink); color:#fff;}\n\n  .board{width:100%; max-width:760px; background:rgba(20,4,40,.55); border:4px solid var(--cyan); border-radius:26px; padding:22px clamp(14px,4vw,30px); box-shadow:0 0 0 5px rgba(34,211,238,.18);}\n  .timer-box{display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:22px;}\n  .timer-display{font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(38px,9vw,56px); direction:ltr; letter-spacing:2px;\n    background:var(--yellow); color:var(--dark); border:4px solid var(--dark); border-radius:60px; padding:0 34px; box-shadow:0 6px 0 var(--dark);}\n  .timer-display.low{background:var(--red); color:#fff; animation:tpulse .5s infinite alternate;}\n  @keyframes tpulse{from{transform:scale(1);} to{transform:scale(1.08);}}\n  .timer-controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;}\n  .timer-input{width:66px; padding:6px 8px; border-radius:10px; border:3px solid var(--dark); background:#fff; color:var(--dark); font-size:15px; font-weight:700; text-align:center;}\n  .btn{background:var(--yellow); color:var(--dark); border:3px solid var(--dark); border-radius:12px; padding:9px 18px; font-family:'Fredoka',sans-serif; font-weight:700; font-size:16px; cursor:pointer; box-shadow:0 4px 0 var(--dark);}\n  .btn.secondary{background:#fff;}\n\n  .tabs{direction:rtl; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:12px;}\n  .tab,.count,.ans .hint,.ans .txt,.pc{font-family:'Cairo',system-ui,sans-serif;}\n  .tab{background:rgba(255,255,255,.1); color:#fff; border:3px solid transparent; border-radius:30px; padding:7px 18px; font-weight:700; font-size:15px; cursor:pointer;}\n  .tab.on{background:var(--pink); border-color:#fff;}\n  .count{text-align:center; color:var(--muted); font-size:14px; margin-bottom:12px;}\n\n  .puzzle{border-radius:24px; border:5px solid var(--dark); background:var(--card); color:var(--dark); padding:28px 14px; box-shadow:8px 8px 0 var(--yellow);}\n  .expr{display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:14px; direction:rtl;}\n  .pc{font-size:clamp(40px,10vw,64px); font-weight:800; line-height:1.2;}\n  .plus{font-family:'Fredoka',sans-serif; font-size:clamp(30px,7vw,44px); color:var(--pink); font-weight:700;}\n  .ans{margin-top:24px; border-radius:16px; border:3px dashed var(--dark); background:#fff; color:var(--dark); text-align:center; padding:14px; cursor:pointer; min-height:68px; display:flex; align-items:center; justify-content:center; flex-direction:column;}\n  .ans .hint{font-size:14px; color:#6b4d94;}\n  .ans .txt{font-size:clamp(28px,7vw,42px); font-weight:800; display:none;}\n  .ans.revealed{background:var(--green); color:#fff; border-style:solid;}\n  .ans.revealed .txt{display:block;}\n  .ans.revealed .hint{display:none;}\n  .nav{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:22px;}\n  .hint-row{text-align:center; color:var(--muted); font-size:12px; margin-top:16px;}\n  @media (max-width:480px){ .teams{flex-direction:column;} }\n\n.rules{width:100%;min-height:100vh;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 15% 20%,#7a24d6 0,transparent 45%),radial-gradient(circle at 85% 85%,#d81b7a 0,transparent 45%),var(--bg)}\n.rules-card{max-width:660px;width:100%;background:var(--card);color:var(--dark);border:5px solid var(--dark);border-radius:26px;box-shadow:9px 9px 0 var(--pink);padding:24px 28px}\n.rules-card h2{font-family:'Fredoka',sans-serif;margin:0 0 10px}.rules-card ol{padding-left:22px;margin:0 0 18px}.rules-card li{margin:9px 0;line-height:1.5}\n.status{text-align:center;font-weight:700;color:var(--yellow);min-height:26px;margin-bottom:12px}\n.btn.bad{background:var(--red);color:#fff}.host{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}\n.buzz:disabled{opacity:.4;cursor:not-allowed}.team.out{opacity:.4;filter:grayscale(1)}\n<\/style><\/head><body>\n<div class=\"start-screen\" id=\"startScreen\"><span class=\"deco\" style=\"top:8%;left:8%;transform:rotate(-12deg)\">\ud83e\udde9<\/span><span class=\"deco\" style=\"top:14%;right:10%;transform:rotate(14deg)\">\ud83e\udd14<\/span><span class=\"deco\" style=\"bottom:12%;left:12%;transform:rotate(-14deg)\">\ud83c\udf3f<\/span><span class=\"deco\" style=\"bottom:9%;right:14%;transform:rotate(12deg)\">\ud83c\udf54<\/span>\n<div class=\"badge\"><div class=\"row\">\ud83e\udde9\ud83e\udd14\ud83c\udfaf<\/div><div class=\"b1\">EMOJI<\/div><div class=\"b2\">CHALLENGE<\/div><\/div><button class=\"start-btn\" onclick=\"startGame()\">START<\/button><\/div>\n<div class=\"rules\" id=\"rules\" style=\"display:none\"><div class=\"rules-card\"><h2>Emoji Challenge \u2014 How to play<\/h2><ol><li>One player from each team comes to the table. The bell is in the middle.<\/li><li>The host shows a puzzle: emojis and letters that join together to make a word.<\/li><li>The fastest player to ring the bell gives the answer.<\/li><li>A wrong answer knocks that team out for this puzzle, and the puzzle is asked again to the teams left.<\/li><li>If the last team left answers wrong too, the puzzle is burned and the answer is shown.<\/li><li>A correct answer is worth 10 points.<\/li><\/ol><button class=\"btn\" onclick=\"playNow()\">LET'S PLAY<\/button><\/div><\/div>\n<div class=\"game-screen\" id=\"gameScreen\" style=\"display:none\">\n<div class=\"top-row\"><button class=\"mini\" onclick=\"toHub()\">\u2190 Hub<\/button><div class=\"title\">\ud83c\udfae Game Night<\/div><div class=\"spacer\"><\/div><\/div>\n<div class=\"teams\" id=\"teams\"><\/div>\n<div class=\"board\"><div class=\"tabs\" id=\"tabs\"><\/div><div class=\"count\" id=\"count\"><\/div><div class=\"status\" id=\"status\"><\/div>\n<div class=\"puzzle\"><div class=\"expr\" id=\"expr\"><\/div><div class=\"ans\" id=\"ans\"><div class=\"hint\" id=\"hint\"><\/div><div class=\"txt\" id=\"ansText\"><\/div><\/div><\/div>\n<div class=\"host\" id=\"host\"><\/div>\n<div class=\"nav\"><button class=\"btn secondary\" onclick=\"move(-1)\">\u2190 Prev<\/button><button class=\"btn secondary\" id=\"soundBtn\" onclick=\"toggleSound()\">\ud83d\udd0a Sound on<\/button><button class=\"btn\" onclick=\"move(1)\">Next \u2192<\/button><\/div>\n<div class=\"hint-row\">Tap the team that rang first. Correct answers give 10 points. Use \u221210 / +10 under each team for corrections.<\/div><\/div><\/div>\n<script>\nlet soundOn=true;function report(i,d){parent.postMessage({t:'pts',i:i,d:d},'*')}function reportName(i,n){parent.postMessage({t:'name',i:i,n:n},'*')}function toHub(){parent.postMessage({t:'hub'},'*')}\nlet actx;function ac(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx}\nfunction beep(f,d,t,v,dl){if(!soundOn)return;try{const c=ac(),t0=c.currentTime+(dl||0),o=c.createOscillator(),g=c.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(v||.25,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d+.02)}catch(e){}}\nfunction sfxReveal(){beep(660,.12,'sine',.25,0);beep(880,.16,'sine',.2,.09)}\nfunction sfxBuzz(){beep(520,.09,'square',.18,0)}\nfunction sfxStrike(){beep(180,.35,'sawtooth',.28,0)}\nfunction sfxTick(l){beep(l?1100:820,l?.13:.07,'square',l?.4:.14,0)}\nfunction sfxTimeUp(){beep(220,.5,'sawtooth',.35,0);beep(160,.55,'sawtooth',.3,.16)}\nfunction sfxClap(){if(!soundOn)return;try{const c=ac();for(let k=0;k<3;k++){const dur=.09,t0=c.currentTime+k*.09,n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=2000;f.Q.value=.7;const g=c.createGain();g.gain.setValueAtTime(.5,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);s.connect(f);f.connect(g);g.connect(c.destination);s.start(t0)}}catch(e){}}\nfunction sfxLose(){if(!soundOn)return;try{const c=ac(),t0=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(320,t0);o.frequency.exponentialRampToValueAtTime(90,t0+.4);g.gain.setValueAtTime(.25,t0);g.gain.exponentialRampToValueAtTime(.001,t0+.45);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+.5)}catch(e){}}\nfunction toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'\ud83d\udd0a Sound on':'\ud83d\udd07 Sound off';if(soundOn)beep(440,.1,'sine',.2,0)}\nfunction startGame(){sfxBuzz();const s=document.getElementById('startScreen');s.classList.add('fade-out');setTimeout(()=>{s.style.display='none';document.getElementById('rules').style.display='flex'},380)}\nfunction playNow(){document.getElementById('rules').style.display='none';document.getElementById('gameScreen').style.display='flex'}\nconst NAMES=window.__NAMES||['Team 1','Team 2','Team 3'],SC=window.__SCORES||[0,0,0];\nlet teams=NAMES.map((n,i)=>({name:n,score:SC[i]}));\nfunction addPts(i,v){const b=teams[i].score;teams[i].score=Math.max(0,b+v);report(i,teams[i].score-b)}\nconst stages = [\n  { name:\"\ud83c\udf0d \u0627\u0644\u062f\u0648\u0644 \u0648\u0627\u0644\u0645\u062f\u0646\", items:[\n    [[\"\ud83d\udcb5\",\"\u062f\u064a\u0641\"],\"\u0645\u0627\u0644\u062f\u064a\u0641\"],\n    [[\"\ud83c\udf0a\",\"\u0631\u064a\u0646\"],\"\u0628\u062d\u0631\u064a\u0646\"],\n    [[\"\u0641\u064a\u062a\",\"\ud83d\udca4\"],\"\u0641\u064a\u062a\u0646\u0627\u0645\"],\n    [[\"\ud83e\udd5b\",\"\u0627\u0646\"],\"\u0644\u0628\u0646\u0627\u0646\"],\n    [[\"\ud83e\uddb7\",\"\u063a\u0627\u0644\"],\"\u0633\u0646\u063a\u0627\u0644\"],\n    [[\"\ud83d\udc41\ufe0f\",\"\u0644\u0627\u0646\u062f\"],\"\u0622\u064a\u0644\u0627\u0646\u062f\"],\n    [[\"\ud83d\udc08\",\"\u0631\"],\"\u0642\u0637\u0631\"],\n    [[\"\ud83c\udfdd\ufe0f\",\"\ud83c\udf11\"],\"\u062c\u0632\u0631 \u0627\u0644\u0642\u0645\u0631\"]\n  ]},\n  { name:\"\ud83c\udf54 \u0627\u0644\u0623\u0637\u0639\u0645\u0629\", items:[\n    [[\"\ud83c\udfe0\",\"\u0632\u0627\"],\"\u0628\u064a\u062a\u0632\u0627\"],\n    [[\"\u0643\",\"\ud83c\udf5a\"],\"\u0643\u0631\u0632\"],\n    [[\"\u0628\u0627\",\"\ud83d\udcaf\"],\"\u0628\u0627\u0645\u064a\u0629\"],\n    [[\"\u270b\",\"\u062a\u0629\"],\"\u0643\u0641\u062a\u0629\"],\n    [[\"\u0643\",\"\ud83d\udeaa\"],\"\u0643\u0628\u0627\u0628\"],\n    [[\"\ud83d\uddd2\ufe0f\",\"\ud83c\udf47\"],\"\u0648\u0631\u0642 \u0639\u0646\u0628\"]\n  ]},\n  { name:\"\ud83c\udf3f \u0627\u0644\u0637\u0628\u064a\u0639\u0629\", items:[\n    [[\"\u0633\",\"\ud83d\udca7\"],\"\u0633\u0645\u0627\u0621\"],\n    [[\"\u0634\",\"\ud83c\udffa\"],\"\u0634\u062c\u0631\u0629\"],\n    [[\"\u0646\",\"\ud83d\udc08\"],\"\u0646\u0647\u0631\"]\n  ]}\n];\nconst flat=[];stages.forEach((s,si)=>s.items.forEach((it,ii)=>flat.push({si,pieces:it[0],ans:it[1],n:ii+1,total:s.items.length})));\nlet cur=0,ph='idle',ring=-1,out=[false,false,false],msg='';\nfunction render(){const p=flat[cur];\n document.getElementById('tabs').innerHTML=stages.map((s,i)=>`<button class=\"tab ${i===p.si?'on':''}\" onclick=\"jump(${i})\">${s.name}<\/button>`).join('');\n document.getElementById('count').textContent=`Puzzle ${p.n} of ${p.total}`;\n document.getElementById('expr').innerHTML=ph==='idle'?'<span class=\"pc\">\ud83d\udd12<\/span>':p.pieces.map(x=>`<span class=\"pc\">${x}<\/span>`).join('<span class=\"plus\">+<\/span>');\n document.getElementById('ansText').textContent=p.ans;\n document.getElementById('ans').className='ans'+(ph==='done'?' revealed':'');\n document.getElementById('hint').textContent=ph==='idle'?'Puzzle hidden':'Who knows it?';\n document.getElementById('status').textContent={idle:'Press \u201cShow puzzle\u201d when everyone is ready.',open:ring>=0?`${teams[ring].name} rang the bell! Is the answer right?`:'Waiting for a bell\u2026',done:msg}[ph];\n document.getElementById('teams').innerHTML=teams.map((t,i)=>`<div class=\"team ${i===ring?'active':''} ${out[i]&&ph==='open'?'out':''}\"><div class=\"team-name\" contenteditable=\"true\" dir=\"auto\" oninput=\"teams[${i}].name=this.textContent;reportName(${i},this.textContent)\">${t.name}<\/div><div class=\"score\">${t.score}<\/div><div class=\"team-btns\"><button class=\"mini\" onclick=\"addScore(${i},-10)\">-10<\/button><button class=\"mini\" onclick=\"addScore(${i},10)\">+10<\/button><\/div><button class=\"buzz\" ${ph==='open'&&ring<0&&!out[i]?'':'disabled'} onclick=\"bell(${i})\">\ud83d\udd14 Bell<\/button><\/div>`).join('');\n let h='';if(ph==='idle')h='<button class=\"btn\" onclick=\"showQ()\">\ud83d\udc41 Show puzzle<\/button>';\n else if(ph==='open'){if(ring>=0)h+='<button class=\"btn\" onclick=\"correct()\">\u2713 Correct +10<\/button><button class=\"btn bad\" onclick=\"wrong()\">\u2717 Wrong<\/button>';h+='<button class=\"btn secondary\" onclick=\"burn()\">Skip / burn<\/button>'}\n else h='<button class=\"btn\" onclick=\"move(1)\">Next puzzle \u2192<\/button>';\n document.getElementById('host').innerHTML=h}\nfunction addScore(i,n){addPts(i,n);if(n>0)sfxClap();else sfxLose();render()}\nfunction showQ(){ph='open';sfxReveal();render()}\nfunction bell(i){if(ph!=='open'||ring>=0||out[i])return;ring=i;sfxBuzz();render()}\nfunction correct(){addPts(ring,10);ph='done';msg=`\ud83c\udf89 ${teams[ring].name} got it! +10`;ring=-1;sfxClap();render()}\nfunction wrong(){out[ring]=true;ring=-1;sfxStrike();if(out.every(x=>x))return burn();render()}\nfunction burn(){ph='done';msg='\ud83d\udd25 Puzzle burned. Nobody scored.';ring=-1;sfxLose();render()}\nfunction reset(){ph='idle';ring=-1;out=[false,false,false];msg='';render()}\nfunction move(d){cur=(cur+d+flat.length)%flat.length;reset()}\nfunction jump(si){cur=flat.findIndex(f=>f.si===si);reset()}\nreset();\n<\/script><\/body><\/html>", "<!DOCTYPE html>\n<html lang=\"en\" dir=\"ltr\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Draw & Guess - Game Night<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    color-scheme:light;\n    --paper:#fbf7ee; --card:#ffffff; --ink:#1f2430; --line:rgba(31,36,48,.07);\n    --red:#e5484d; --blue:#2f6fed; --green:#1fa463; --yellow:#ffe066; --orange:#f59f00; --muted:#6b7280;\n    box-sizing:border-box;\n    padding-top:env(safe-area-inset-top,0px);\n    padding-bottom:env(safe-area-inset-bottom,0px);\n  }\n  *{box-sizing:inherit;}\n  html{scroll-padding-top:env(safe-area-inset-top,0px);}\n  html,body{height:100%;}\n  body{margin:0; color:var(--ink); font-family:'Inter',system-ui,sans-serif; min-height:100%; display:flex; flex-direction:column; align-items:center;\n    background-color:var(--paper);\n    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);\n    background-size:28px 28px;}\n  .k{font-family:'Kalam','Comic Sans MS',cursive;}\n  .wob{border-radius:18px 26px 16px 24px/24px 16px 26px 18px;}\n\n  /* start screen */\n  .start-screen{width:100%; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:38px; position:relative; overflow:hidden; padding:20px; transition:opacity .4s ease;}\n  .start-screen.fade-out{opacity:0; pointer-events:none;}\n  .deco{position:absolute; font-size:clamp(34px,7vw,64px); opacity:.55; pointer-events:none;}\n  .badge{position:relative; z-index:2; width:min(88vw,520px); text-align:center; background:var(--card); border:5px solid var(--ink); box-shadow:9px 9px 0 var(--yellow); padding:26px 30px; transform:rotate(1.5deg);}\n  .badge .row{font-size:clamp(26px,7vw,36px); letter-spacing:8px; margin-bottom:4px;}\n  .b1{font-family:'Kalam',cursive; font-weight:700; font-size:clamp(50px,15vw,92px); line-height:1; color:var(--ink);}\n  .b2{font-family:'Kalam',cursive; font-weight:700; font-size:clamp(34px,10vw,62px); line-height:1.1; color:var(--red);\n    background:linear-gradient(transparent 62%, var(--yellow) 62% 90%, transparent 90%); display:inline-block; padding:0 10px;}\n  .start-btn{position:relative; z-index:2; padding:10px 54px; border:4px solid var(--ink); background:var(--blue); color:#fff; font-family:'Kalam',cursive; font-weight:700; font-size:28px; cursor:pointer; box-shadow:0 7px 0 var(--ink);}\n  .start-btn:active{transform:translateY(5px); box-shadow:0 2px 0 var(--ink);}\n\n  /* game screen */\n  .game-screen{width:100%; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:22px 14px 40px;}\n  .top-row{display:flex; align-items:center; justify-content:space-between; width:100%; max-width:960px; margin-bottom:14px;}\n  .top-row .spacer{width:78px;}\n  .title{font-family:'Kalam',cursive; font-size:clamp(26px,5vw,38px); font-weight:700; margin:0; text-align:center;}\n  .mini{background:var(--card); color:var(--ink); border:3px solid var(--ink); padding:4px 12px; font-family:'Kalam',cursive; font-weight:700; font-size:16px; cursor:pointer; box-shadow:0 3px 0 var(--ink); border-radius:12px 14px 10px 14px;}\n  .mini:active:not(:disabled),.btn:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--ink);}\n  .mini:disabled{opacity:.4; cursor:not-allowed;}\n  .btn{background:var(--yellow); color:var(--ink); border:3px solid var(--ink); padding:8px 20px; font-family:'Kalam',cursive; font-weight:700; font-size:18px; cursor:pointer; box-shadow:0 4px 0 var(--ink); border-radius:14px 18px 12px 18px;}\n  .btn.blue{background:var(--blue); color:#fff;}\n  .btn.plain{background:var(--card);}\n\n  .teams{display:flex; gap:16px; width:100%; max-width:960px; flex-wrap:wrap; justify-content:center; margin-bottom:22px;}\n  .team{background:var(--card); border:4px solid var(--ink); border-top:12px solid var(--tc); box-shadow:6px 6px 0 var(--tc); padding:12px 16px 14px; flex:1 1 220px; text-align:center;}\n  .team-name{font-family:'Kalam',cursive; font-weight:700; font-size:20px; outline:none; border-bottom:2px dashed transparent;}\n  .team-name:focus{border-bottom:2px dashed var(--tc);}\n  .score{font-family:'Kalam',cursive; font-weight:700; font-size:52px; line-height:1.05; color:var(--tc);}\n  .team-btns{display:flex; gap:8px; justify-content:center; margin-top:4px;}\n  .got{margin-top:10px; width:100%; background:var(--tc); color:#fff; border:3px solid var(--ink); padding:6px 8px; font-family:'Kalam',cursive; font-weight:700; font-size:17px; cursor:pointer; box-shadow:0 4px 0 var(--ink); border-radius:12px 16px 10px 16px;}\n  .got:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--ink);}\n  .got:disabled{opacity:.4; cursor:not-allowed;}\n\n  .board{width:100%; max-width:820px; background:var(--card); border:5px solid var(--ink); box-shadow:9px 9px 0 var(--ink); padding:22px clamp(14px,4vw,30px);}\n  .phase{display:inline-block; font-family:'Kalam',cursive; font-weight:700; font-size:22px; padding:2px 22px; border:3px solid var(--ink); border-radius:30px; background:#eee;}\n  .phase.draw{background:var(--blue); color:#fff;}\n  .phase.guess{background:var(--orange); color:var(--ink);}\n  .phase.done{background:var(--ink); color:#fff;}\n  .timer-box{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:20px;}\n  .timer-display{font-family:'Kalam',cursive; font-weight:700; font-size:clamp(54px,13vw,84px); line-height:1; letter-spacing:2px;}\n  .timer-display.low{color:var(--red); animation:tpulse .5s infinite alternate;}\n  @keyframes tpulse{from{transform:scale(1);} to{transform:scale(1.09);}}\n  .controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center;}\n  .set-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; font-size:13px; color:var(--muted);}\n  .timer-input{width:58px; padding:5px 6px; border:3px solid var(--ink); border-radius:10px; background:#fff; color:var(--ink); font-size:15px; font-weight:700; text-align:center;}\n\n  .tabs{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:6px 0 6px;}\n  .tab{background:transparent; color:var(--ink); border:3px solid transparent; border-radius:30px; padding:4px 16px; font-family:'Kalam',cursive; font-weight:700; font-size:18px; cursor:pointer;}\n  .tab.on{background:var(--yellow); border-color:var(--ink);}\n  .roundinfo{text-align:center; color:var(--muted); font-size:14px; margin-bottom:12px;}\n\n  .wordcard{border:4px dashed var(--ink); background:#fffdf6; padding:22px 12px; text-align:center; min-height:240px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;}\n  .wordcard.revealed{border-style:solid; background:#e8f7ee;}\n  .chip{font-family:'Kalam',cursive; font-weight:700; font-size:20px; background:var(--yellow); border:3px solid var(--ink); padding:0 16px; border-radius:20px; margin-bottom:6px;}\n  .pic{font-size:clamp(70px,18vw,120px); line-height:1.1;}\n  .word{font-family:'Kalam',cursive; font-weight:700; font-size:clamp(26px,6vw,40px); line-height:1.15;}\n  .note{font-family:'Kalam',cursive; font-size:22px; font-weight:700; color:var(--green); min-height:30px;}\n  .nav{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:22px;}\n  .hint-row{text-align:center; color:var(--muted); font-size:12px; margin-top:16px;}\n  @media (max-width:520px){ .teams{flex-direction:column;} }\n  .rules{width:100%;min-height:100vh;align-items:center;justify-content:center;padding:20px}\n  .rules-card{max-width:660px;width:100%;background:var(--card);border:5px solid var(--ink);box-shadow:9px 9px 0 var(--yellow);padding:24px 28px}\n  .rules-card h2{font-family:'Kalam',cursive;font-size:34px;margin:0 0 8px}.rules-card ol{padding-left:22px;margin:0 0 18px}.rules-card li{margin:9px 0;line-height:1.5}\n<\/style>\n<\/head>\n<body>\n\n<div class=\"start-screen\" id=\"startScreen\">\n  <span class=\"deco\" style=\"top:8%;left:8%;transform:rotate(-14deg)\">\u270f\ufe0f<\/span>\n  <span class=\"deco\" style=\"top:12%;right:9%;transform:rotate(12deg)\">\ud83c\udfa8<\/span>\n  <span class=\"deco\" style=\"top:44%;left:4%;transform:rotate(10deg)\">\ud83d\udd8d\ufe0f<\/span>\n  <span class=\"deco\" style=\"top:50%;right:5%;transform:rotate(-10deg)\">\ud83e\udd14<\/span>\n  <span class=\"deco\" style=\"bottom:11%;left:11%;transform:rotate(-8deg)\">\ud83d\uddbc\ufe0f<\/span>\n  <span class=\"deco\" style=\"bottom:9%;right:13%;transform:rotate(14deg)\">\u23f1\ufe0f<\/span>\n  <div class=\"badge wob\">\n    <div class=\"row\">\u270f\ufe0f\ud83c\udfa8\ud83e\udd14<\/div>\n    <div class=\"b1\">DRAW<\/div>\n    <div class=\"b2\">& GUESS<\/div>\n  <\/div>\n  <button class=\"start-btn wob\" onclick=\"startGame()\">START<\/button>\n<\/div>\n\n<div class=\"rules\" id=\"rules\" style=\"display:none\"><div class=\"rules-card\"><h2>Draw & Guess \u2014 How to play<\/h2><ol><li>One drawer from each team comes forward with an iPad (Notes app).<\/li><li>The host shows the word to the three drawers only. They all draw the same word at the same time.<\/li><li>No writing, no talking and no body gestures.<\/li><li>Drawers get 1 minute to draw, then every team gets 1 minute to guess. Any team can answer.<\/li><li>The first team to say the right answer wins the round. Easy words are worth 10 points, mid 20 and hard 30.<\/li><li>If nobody guesses before the timer ends, the answer is shown.<\/li><\/ol><button class=\"btn\" onclick=\"playNow()\">LET'S PLAY<\/button><\/div><\/div>\n<div class=\"game-screen\" id=\"gameScreen\" style=\"display:none;\">\n  <div class=\"top-row\">\n    <button class=\"mini\" onclick=\"goBack()\">\u2190 Hub<\/button>\n    <div class=\"title\">\ud83c\udfae Game Night<\/div>\n    <div class=\"spacer\"><\/div>\n  <\/div>\n\n  <div class=\"teams\" id=\"teams\"><\/div>\n\n  <div class=\"board wob\">\n    <div class=\"timer-box\">\n      <span class=\"phase\" id=\"phase\">Ready<\/span>\n      <div class=\"timer-display\" id=\"timerDisplay\">01:00<\/div>\n      <div class=\"controls\">\n        <button class=\"btn blue\" id=\"startBtn\" onclick=\"toggleTimer()\">\u25b6 Start<\/button>\n        <button class=\"btn plain\" onclick=\"addTimer(30)\">+30<\/button>\n        <button class=\"btn plain\" onclick=\"resetRound()\">Reset<\/button>\n      <\/div>\n      <div class=\"set-row\">\n        Draw <input type=\"number\" id=\"drawSet\" class=\"timer-input\" min=\"5\" step=\"5\" value=\"60\">\n        Guess <input type=\"number\" id=\"guessSet\" class=\"timer-input\" min=\"5\" step=\"5\" value=\"60\"> sec\n        <button class=\"mini\" onclick=\"setDurations()\">Set<\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"tabs\" id=\"tabs\"><\/div>\n    <div class=\"roundinfo\" id=\"roundInfo\"><\/div>\n\n    <div class=\"wordcard wob\" id=\"wordcard\">\n      <div class=\"chip\" id=\"chip\"><\/div>\n      <div class=\"pic\" id=\"pic\">\u2753<\/div>\n      <div class=\"word\" id=\"word\">What is it?<\/div>\n      <div class=\"note\" id=\"note\"><\/div>\n    <\/div>\n\n    <div class=\"nav\">\n      <button class=\"btn plain\" onclick=\"move(-1)\">\u2190 Prev<\/button>\n      <button class=\"btn plain\" onclick=\"revealNow()\">\ud83d\udc41 Show answer<\/button>\n      <button class=\"btn plain\" id=\"soundBtn\" onclick=\"toggleSound()\">\ud83d\udd0a Sound on<\/button>\n      <button class=\"btn\" onclick=\"move(1)\">Next \u2192<\/button>\n    <\/div>\n    <div class=\"hint-row\">Tap \"Guessed it\" under the team that answered first. If nobody gets it, the answer shows when the guess timer ends.<\/div>\n  <\/div>\n<\/div>\n\n<script>\nfunction report(i,d){parent.postMessage({t:'pts',i:i,d:d},'*')}function reportName(i,n){parent.postMessage({t:'name',i:i,n:n},'*')}function toHub(){parent.postMessage({t:'hub'},'*')}\nfunction playNow(){document.getElementById('rules').style.display='none';document.getElementById('gameScreen').style.display='flex'}\n// ---- Words: edit here. Order = round order. [word, picture] ----\nconst levels = [\n  { name:\"Easy\", dot:\"\ud83d\udfe2\", pts:10, items:[\n    [\"Sun\",\"\u2600\ufe0f\"],[\"Tree\",\"\ud83c\udf33\"],[\"Fish\",\"\ud83d\udc1f\"],[\"Ice cream\",\"\ud83c\udf66\"],[\"Airplane\",\"\u2708\ufe0f\"]\n  ]},\n  { name:\"Mid\", dot:\"\ud83d\udfe1\", pts:20, items:[\n    [\"Island\",\"\ud83c\udfdd\ufe0f\"],[\"Map\",\"\ud83d\uddfa\ufe0f\"],[\"Crown\",\"\ud83d\udc51\"],[\"Robot\",\"\ud83e\udd16\"],[\"Magnet\",\"\ud83e\uddf2\"]\n  ]},\n  { name:\"Hard\", dot:\"\ud83d\udd34\", pts:30, items:[\n    [\"Someone charging the phone\",\"\ud83d\udd0c\ud83d\udcf1\"],[\"Someone\u2019s wedding\",\"\ud83d\udc70\ud83e\udd35\"],[\"Someone taking a selfie\",\"\ud83e\udd33\"],[\"Someone scared\",\"\ud83d\ude31\"],[\"Someone hangry\",\"\ud83d\ude21\ud83c\udf54\"]\n  ]}\n];\nconst flat = [];\nlevels.forEach((L,li)=>L.items.forEach((it,ii)=>flat.push({li, word:it[0], pic:it[1], pts:L.pts, n:ii+1, total:L.items.length})));\n\nconst TEAM_COLORS = ['--red','--blue','--green'];\nlet teams = (window.__NAMES||[\"Team 1\",\"Team 2\",\"Team 3\"]).map((n,i)=>({name:n,score:(window.__SCORES||[0,0,0])[i]}));\nlet idx = 0, phase = 'idle', drawDur = 60, guessDur = 60, timeLeft = 60;\nlet timerInterval = null, running = false, revealed = false, roundDone = false, winner = -1, noteText = '', soundOn = true;\n\n// ---- sounds (generated in code) ----\nlet actx;\nfunction ac(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }\nfunction beep(freq, dur, type, vol, delay){\n  if(!soundOn) return;\n  try{\n    const c = ac(), t0 = c.currentTime + (delay||0), o = c.createOscillator(), g = c.createGain();\n    o.type = type||'sine'; o.frequency.setValueAtTime(freq, t0);\n    g.gain.setValueAtTime(vol||0.25, t0); g.gain.exponentialRampToValueAtTime(0.001, t0+dur);\n    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+0.02);\n  }catch(e){}\n}\nfunction sfxReveal(){ beep(660,0.12,'sine',0.25,0); beep(880,0.16,'sine',0.2,0.09); }\nfunction sfxGo(){ beep(700,0.1,'sine',0.25,0); beep(1000,0.16,'sine',0.25,0.1); }\nfunction sfxPhase(){ beep(500,0.12,'square',0.2,0); beep(750,0.12,'square',0.2,0.14); beep(1000,0.2,'square',0.2,0.28); }\nfunction sfxTick(loud){ beep(loud?1100:820, loud?0.13:0.07, 'square', loud?0.4:0.14, 0); }\nfunction sfxTimeUp(){ beep(220,0.5,'sawtooth',0.35,0); beep(160,0.55,'sawtooth',0.3,0.16); }\nfunction sfxClap(){\n  if(!soundOn) return;\n  try{\n    const c = ac();\n    for(let k=0;k<3;k++){\n      const dur=0.09, t0=c.currentTime+k*0.09, n=Math.floor(c.sampleRate*dur);\n      const b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);\n      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);\n      const s=c.createBufferSource(); s.buffer=b;\n      const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2000; f.Q.value=0.7;\n      const g=c.createGain(); g.gain.setValueAtTime(0.5,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);\n      s.connect(f); f.connect(g); g.connect(c.destination); s.start(t0);\n    }\n  }catch(e){}\n}\nfunction sfxLose(){\n  if(!soundOn) return;\n  try{\n    const c=ac(), t0=c.currentTime, o=c.createOscillator(), g=c.createGain();\n    o.type='sawtooth'; o.frequency.setValueAtTime(320,t0); o.frequency.exponentialRampToValueAtTime(90,t0+0.4);\n    g.gain.setValueAtTime(0.25,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+0.45);\n    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+0.5);\n  }catch(e){}\n}\nfunction toggleSound(){\n  soundOn = !soundOn;\n  document.getElementById('soundBtn').textContent = soundOn ? '\ud83d\udd0a Sound on' : '\ud83d\udd07 Sound off';\n  if(soundOn) beep(440,0.1,'sine',0.2,0);\n}\n\n// ---- screens ----\nfunction startGame(){\n  sfxGo();\n  const s = document.getElementById('startScreen');\n  s.classList.add('fade-out');\n  setTimeout(()=>{ s.style.display='none'; document.getElementById('rules').style.display='flex'; }, 380);\n}\nfunction goBack(){\n  toHub(); return;\n  resetRound();\n  document.getElementById('gameScreen').style.display = 'none';\n  const s = document.getElementById('startScreen');\n  s.style.display = 'flex'; s.classList.remove('fade-out');\n}\n\n// ---- teams ----\nfunction renderTeams(){\n  const pts = flat[idx].pts;\n  document.getElementById('teams').innerHTML = teams.map((t,i)=>`\n    <div class=\"team wob\" style=\"--tc:var(${TEAM_COLORS[i]})\">\n      <div class=\"team-name\" contenteditable=\"true\" oninput=\"teams[${i}].name=this.textContent;reportName(${i},this.textContent)\">${t.name}<\/div>\n      <div class=\"score\">${t.score}<\/div>\n      <div class=\"team-btns\">\n        <button class=\"mini\" onclick=\"addScore(${i},-10)\">-10<\/button>\n        <button class=\"mini\" onclick=\"addScore(${i},10)\">+10<\/button>\n      <\/div>\n      <button class=\"got\" ${roundDone?'disabled':''} onclick=\"award(${i})\">\u2713 Guessed it +${pts}<\/button>\n    <\/div>`).join('');\n}\nfunction addScore(i,n){\n  const b0=teams[i].score; teams[i].score = Math.max(0, b0+n); report(i, teams[i].score-b0);\n  renderTeams();\n  if(n>0) sfxClap(); else sfxLose();\n}\nfunction award(i){\n  if(roundDone) return;\n  roundDone = true; winner = i;\n  teams[i].score += flat[idx].pts; report(i, flat[idx].pts);\n  stopTimer(); phase = 'done';\n  revealed = true; noteText = '';\n  renderAll(); sfxClap();\n}\n\n// ---- round / word card ----\nfunction renderTabs(){\n  const cur = flat[idx].li;\n  document.getElementById('tabs').innerHTML = levels.map((L,i)=>\n    `<button class=\"tab ${i===cur?'on':''}\" onclick=\"jumpLevel(${i})\">${L.dot} ${L.name}<\/button>`).join('');\n}\nfunction renderCard(){\n  const p = flat[idx], L = levels[p.li];\n  document.getElementById('roundInfo').textContent = `Round ${idx+1} of ${flat.length}  \u00b7  ${L.name} ${p.n}/${p.total}`;\n  document.getElementById('chip').textContent = `${L.dot} ${L.name} \u00b7 ${p.pts} pts`;\n  document.getElementById('wordcard').classList.toggle('revealed', revealed);\n  document.getElementById('pic').textContent = revealed ? p.pic : '\u2753';\n  document.getElementById('word').textContent = revealed ? p.word : 'What is it?';\n  document.getElementById('note').textContent = winner>=0 ? `\ud83c\udf89 ${teams[winner].name} got it! +${p.pts}` : (revealed ? noteText : '');\n}\nfunction move(d){ idx = (idx+d+flat.length)%flat.length; resetRound(); }\nfunction jumpLevel(li){ idx = flat.findIndex(f=>f.li===li); resetRound(); }\nfunction revealNow(){\n  stopTimer(); if(phase!=='idle') phase='done'; else phase='done';\n  revealed = true; noteText = 'Here is the answer!';\n  renderAll(); sfxReveal();\n}\n\n// ---- timer: draw phase then guess phase ----\nfunction renderTimer(){\n  const m = String(Math.floor(timeLeft/60)).padStart(2,'0'), s = String(timeLeft%60).padStart(2,'0');\n  const d = document.getElementById('timerDisplay');\n  d.textContent = `${m}:${s}`;\n  d.classList.toggle('low', (phase==='draw'||phase==='guess') && timeLeft<=10 && timeLeft>0);\n}\nfunction renderPhase(){\n  const el = document.getElementById('phase');\n  el.className = 'phase ' + (phase==='draw'?'draw':phase==='guess'?'guess':phase==='done'?'done':'');\n  el.textContent = phase==='draw' ? '\u270f\ufe0f DRAW!' : phase==='guess' ? '\ud83e\udd14 GUESS!' : phase==='done' ? '\u23f9 Round over' : 'Ready';\n  const b = document.getElementById('startBtn');\n  b.textContent = running ? '\u23f8 Pause' : (phase==='draw'||phase==='guess') ? '\u25b6 Resume' : '\u25b6 Start';\n}\nfunction renderAll(){ renderTeams(); renderTabs(); renderCard(); renderTimer(); renderPhase(); }\nfunction stopTimer(){ clearInterval(timerInterval); running = false; }\nfunction toggleTimer(){\n  if(phase==='done') resetRound();\n  if(running){ stopTimer(); }\n  else{\n    if(phase==='idle'){ phase='draw'; timeLeft=drawDur; sfxGo(); }\n    running = true; timerInterval = setInterval(tick, 1000);\n  }\n  renderTimer(); renderPhase();\n}\nfunction tick(){\n  timeLeft--;\n  if(timeLeft<=0){\n    if(phase==='draw'){\n      phase='guess'; timeLeft=guessDur; sfxPhase();\n    }else{\n      timeLeft=0; stopTimer(); phase='done'; revealed=true; noteText='Nobody got it this time \ud83d\ude05';\n      sfxTimeUp(); setTimeout(sfxReveal, 700);\n      renderAll(); return;\n    }\n    renderTimer(); renderPhase(); return;\n  }\n  renderTimer(); sfxTick(timeLeft<=10);\n}\nfunction addTimer(n){ if(phase==='draw'||phase==='guess'){ timeLeft += n; renderTimer(); } }\nfunction resetRound(){\n  stopTimer(); phase='idle'; timeLeft=drawDur; revealed=false; roundDone=false; winner=-1; noteText='';\n  renderAll();\n}\nfunction setDurations(){\n  const d = parseInt(document.getElementById('drawSet').value,10), g = parseInt(document.getElementById('guessSet').value,10);\n  if(!isNaN(d) && d>0) drawDur = d;\n  if(!isNaN(g) && g>0) guessDur = g;\n  if(phase==='idle'){ timeLeft = drawDur; renderTimer(); }\n}\n\nrenderAll();\n<\/script>\n<\/body>\n<\/html>\n"];
const hn=['Team 1','Team 2','Team 3'];let tot=[0,0,0];
function begin(){document.getElementById('hubStart').style.display='none';document.getElementById('hubMenu').style.display='flex';draw()}
function draw(){const mx=Math.max(...tot);document.getElementById('sb').innerHTML=tot.map((v,i)=>`<div class="chip ${v>0&&v===mx?'lead':''}"><span contenteditable="true" oninput="hn[${i}]=this.textContent">${hn[i]}</span><b>${v>0&&v===mx?'👑 ':''}${v}</b></div>`).join('')}
function openGame(k){const f=document.getElementById('frame');f.srcdoc=DOCS[k].replace('<head>',()=>'<head><script>window.__NAMES='+JSON.stringify(hn)+';window.__SCORES='+JSON.stringify(tot)+'<\/script>');f.style.display='block'}
addEventListener('message',e=>{const d=e.data||{};if(d.t==='pts')tot[d.i]=Math.max(0,tot[d.i]+d.d);else if(d.t==='name')hn[d.i]=d.n;else if(d.t==='hub'){const f=document.getElementById('frame');f.style.display='none';f.srcdoc='';draw()}});
</script></body></html>
